        <label for="nome">Nome</label>

        <label form="raca">Raça:</label>

            <option value="nobre">Nobre</option>
            <option value="paladino">Paladino</option>
        </select><br><br>
        <label for="origens">Origens:</label>
        <select name="origens" id="origens" required>
            <option value="" selected disabled ></option>
            <option value="acolito">Acólito</option>
            <option value="amigo">Amigo dos animais</option>
            <option value="amnesico">Amnésico</option>
            <option value="aristocrata">Aristocrata</option>

            <option value="estudioso">Estudioso</option>
            <option value="fazendeiro">Fazendeiro</option>
            <option value="forasteiro">Forasteiro</option>
            <option value="gladiador">Gladiador</option>

        <select name="deuses" id="deuses" required>
            <option value="" selected disabled ></option>
            <option value="nenhum">Nenhum</option>
            <option value="arahadak">Arahadak</option>
            <option value="allihanna">Allihanna</option>

        <label for="jogador">Nome do jogador</label>
        <input type="text" required><br><br>

        <!--------------------- Atributos ---------------------->

        <label for="forca" class="atrN" id="atrNfor">For</label>
        <label for="destreza" class="atrN" id="atrNdes">Des</label>
        <label for="constituicao" class="atrN" id="atrNcon"> Con</label>
        <label for="inteligencia" class="atrN" id="atrNint">Int</label>
        <label for="sabedoria" class="atrN" id="atrNsab">Sab</label>
        <label for="carisma" class="atrN" id="atrNcar">Car</label>
        <br>
        <input type="number" class="atrF" id="atrFfor" required>
        <input type="number" class="atrF" id="atrFdes" required>
        <input type="number" class="atrF" id="atrFcon" required>
        <input type="number" class="atrF" id="atrFint" required>
        <input type="number" class="atrF" id="atrFsab" required>
        <input type="number" class="atrF" id="atrFcar" required>
        <br>
        <input type="number" class="atrD" id="atrDfor" value="0" required>
        <input type="number" class="atrD" id="atrDdes" value="0" required>
        <input type="number" class="atrD" id="atrDcon" value="0" required>
        <input type="number" class="atrD" id="atrDint" value="0" required>
        <input type="number" class="atrD" id="atrDsab" value="0" required>
